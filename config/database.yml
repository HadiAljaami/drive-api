default: &default
  adapter: postgresql
  encoding: unicode
  pool: <%= ENV.fetch("RAILS_MAX_THREADS") { 5 } %>
  username: <%= ENV.fetch("POSTGRES_USER", "postgres") %>
  password: <%= ENV.fetch("POSTGRES_PASSWORD", "1234") %>
  host: <%= ENV.fetch("POSTGRES_HOST", "localhost") %>
  port: <%= ENV.fetch("POSTGRES_PORT", 5432) %>

development:
  <<: *default
  database: drive_development

test:
  <<: *default
  database: drive_test

production:
  primary: &primary_production
    <<: *default
    database: drive_production
    username: drive
    password: <%= ENV["DRIVE_DATABASE_PASSWORD"] %>

  cache:
    <<: *primary_production
    database: drive_production_cache
    migrations_paths: db/cache_migrate

  queue:
    <<: *primary_production
    database: drive_production_queue
    migrations_paths: db/queue_migrate

  cable:
    <<: *primary_production
    database: drive_production_cable
    migrations_paths: db/cable_migrate